name: CGMS Product Readiness CI

on:
  push:
    branches:
      - main
      - cgms-v2-roadmap

  pull_request:
    branches:
      - main
      - cgms-v2-roadmap

  workflow_dispatch:
    inputs:
      gate_mode:
        description: Product Readiness gate mode
        required: true
        default: standard
        type: choice
        options:
          - standard
          - strict

permissions:
  contents: read

concurrency:
  group: product-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-readiness:
    name: Regression and Product Readiness
    runs-on: ubuntu-latest

    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cgms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cgms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DEBUG: "false"

      TELEGRAM_BOT_TOKEN: >-
        123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi

      OPENAI_API_KEY: test-openai-api-key

      CGMS_JWT_SECRET: >-
        N7q4V2m8K6r1P9x5T3c7B4d8F2h6J9s1

      DATABASE_URL: >-
        postgresql+psycopg://postgres:postgres@localhost:5432/cgms_test

      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Display runtime information
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install \
            pytest==9.1.1 \
            pytest-asyncio==1.4.0 \
            httpx==0.28.1

      - name: Initialize isolated test database schema
        run: |
          python - <<'PY'
          from sqlalchemy import inspect, text
          from sqlmodel import SQLModel

          # Import the production dashboard model surface so every
          # governed SQLModel table is registered in metadata.
          import app.dashboard.main  # noqa: F401
          from app.db.session import engine

          with engine.begin() as connection:
              connection.execute(
                  text(
                      "CREATE EXTENSION IF NOT EXISTS vector"
                  )
              )

          SQLModel.metadata.create_all(
              engine
          )

          expected_tables = set(
              SQLModel.metadata.tables
          )

          actual_tables = set(
              inspect(
                  engine
              ).get_table_names()
          )

          missing_tables = sorted(
              expected_tables
              - actual_tables
          )

          if missing_tables:
              raise RuntimeError(
                  "CI test schema initialization "
                  "is incomplete. Missing tables: "
                  f"{missing_tables}"
              )

          print(
              "CI test schema initialized:",
              len(actual_tables),
              "tables",
          )
          PY

      - name: Create evidence directories
        run: |
          mkdir -p artifacts/test-results
          mkdir -p artifacts/product-readiness

      - name: Run full regression suite
        run: |
          python -m pytest \
            -q \
            --junitxml=artifacts/test-results/pytest.xml

      - name: Resolve gate mode
        id: gate-mode
        shell: bash
        run: |
          MODE="standard"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.gate_mode }}"
          fi

          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"
          echo "Product Readiness gate mode: ${MODE}"

      - name: Run Product Readiness gate
        run: |
          python scripts/ci/product_readiness_gate.py \
            --mode "${{ steps.gate-mode.outputs.mode }}" \
            --minimum-overall-score 23 \
            --expected-capability-count 38 \
            --output-directory artifacts/product-readiness

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cgms-product-readiness-${{ github.run_number }}
          path: |
            artifacts/test-results/pytest.xml
            artifacts/product-readiness/product_readiness_report.json
            artifacts/product-readiness/product_readiness_summary.md
          if-no-files-found: warn
          retention-days: 30